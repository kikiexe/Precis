name: Précis CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check if Monorepo Package Exists
        id: check_pkg
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm Package Manager
        if: steps.check_pkg.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Setup Node.js Runtime
        if: steps.check_pkg.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        if: steps.check_pkg.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Static Type Check (Svelte 5 Runes)
        if: steps.check_pkg.outputs.exists == 'true'
        run: pnpm -r check

      - name: Production Build Check
        if: steps.check_pkg.outputs.exists == 'true'
        run: pnpm -r build

  backend-test:
    name: Backend Lint, Migrations & PHPUnit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: precis_test
          POSTGRES_USER: precis_user
          POSTGRES_PASSWORD: secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, redis, bcmath, pcntl
          coverage: none

      - name: Restore Composer Cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate --env=testing

      - name: Validate PHP Syntax Integrity
        run: |
          find app config database routes -type f -name "*.php" -exec php -l {} +

      - name: Run Database Migrations & Seeders
        run: php artisan migrate:fresh --seed --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: precis_test
          DB_USERNAME: precis_user
          DB_PASSWORD: secret_test_password

      - name: Execute Automated Test Suite (PHPUnit)
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: precis_test
          DB_USERNAME: precis_user
          DB_PASSWORD: secret_test_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
